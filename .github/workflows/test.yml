name: .NET and browser runspace
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 11.0.100-rc.2.26504.105
      - run: dotnet workload install wasm-tools
      - run: dotnet restore DotnetDide.slnx --locked-mode
      - run: dotnet test tests/DotnetDide.Core.Tests --no-restore
      - run: dotnet publish src/DotnetDide.Browser -c Release -o artifacts/site --no-restore
      - run: dotnet publish tools/DotnetDide.Relay -c Release -o artifacts/relay --no-restore
      - name: Test browser runtime
        shell: bash
        run: |
          set -o pipefail
          if ! dotnet test tests/DotnetDide.Browser.Tests --no-restore 2>&1 | tee browser-tests.log; then
            # Publish only a validated source-code test identifier, never error payloads or log text.
            awk '/^  Failed DotnetDide[.]Browser[.]Tests[.][A-Za-z0-9_]+[.][A-Za-z0-9_]+ / { print "::error title=Browser test failed::" $2 }' browser-tests.log
            exit 1
          fi
        env:
          CHROME_BIN: /usr/bin/google-chrome
      - uses: actions/upload-artifact@v4
        with:
          name: dotnetdide-browser
          path: artifacts/site/wwwroot
      - uses: actions/upload-artifact@v4
        with:
          name: dotnetdide-relay
          path: artifacts/relay
      - uses: actions/upload-pages-artifact@v4
        if: github.ref == 'refs/heads/master' && github.event_name != 'pull_request'
        with:
          path: artifacts/site/wwwroot
      - uses: actions/upload-artifact@v4
        with:
          name: playground-screenshots
          path: artifacts/playground-*.png
  deploy:
    if: github.ref == 'refs/heads/master' && github.event_name != 'pull_request'
    needs: test
    runs-on: ubuntu-24.04
    permissions:
      pages: write
      id-token: write
    concurrency:
      group: github-pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/configure-pages@v5
      - name: Deploy testing page
        id: deployment
        uses: actions/deploy-pages@v4
  release:
    if: github.ref == 'refs/heads/master' && github.event_name != 'pull_request'
    needs: test
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    concurrency:
      group: dotnetdide-releases
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: dotnetdide-browser
          path: artifacts/site/wwwroot
      - uses: actions/download-artifact@v4
        with:
          name: dotnetdide-relay
          path: artifacts/relay
      - name: Select UTC release version
        id: version
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          day="$(date -u +%y.%m%d)"
          gh api "repos/$GH_REPO/git/matching-refs/tags/$day." --jq '.[].ref' > existing-tags.txt
          version="$(bash .github/scripts/next-release-version.sh "$day" < existing-tags.txt)"
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - name: Package tested browser runtime
        env:
          RELEASE_VERSION: ${{ steps.version.outputs.version }}
        run: bash .github/scripts/package-release.sh "$RELEASE_VERSION"
      - name: Publish versioned ZIP and checksum
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_VERSION: ${{ steps.version.outputs.version }}
          RELEASE_COMMIT: ${{ github.sha }}
        run: |
          cat > release-notes.md <<'NOTES'
          Tested .NET 11 browser runspace and Monaco playground, ready for static hosting or embedding.

          Download the versioned ZIP and verify its SHA-256 checksum. Extract it and serve `wwwroot/` over HTTPS or localhost. The archive includes the runtime, editor assets, examples, the optional native .NET HTTP/SOCKS5 relay in `relay/`, `integration.md`, `llm.md`, library inventories and license notices.

          Bundled image/audio libraries generate PNG, JPEG, WAV and Ogg Opus files. Optional `DotnetDide.Nuget.Load` downloads compatible managed packages directly in the browser with a separate permission and bounded persistent Cache Storage. See `docs/media-and-packages.md` for examples, limits and cache controls.

          See `docs/networking.md` to configure the relay with allowed origins/targets and an optional upstream SOCKS5 proxy or Tor client. The bridge distribution website is not a proxy.

          Workspace programs support `Dotnet.Build()` and `await Dotnet.Run("file.cs")` or a supported `.csproj`. Builds produce managed DLL/PDB artifacts. See `llm.md` for the supported project subset and browser limitations.
          NOTES
          gh release create "$RELEASE_VERSION" \
            --target "$RELEASE_COMMIT" \
            --title "dotnetdide $RELEASE_VERSION" \
            --notes-file release-notes.md \
            "artifacts/releases/dotnetdide-$RELEASE_VERSION.zip" \
            "artifacts/releases/dotnetdide-$RELEASE_VERSION.zip.sha256"
