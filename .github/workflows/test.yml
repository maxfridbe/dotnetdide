name: .NET and browser runspace
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 11.0.100-rc.2.26504.105
      - run: dotnet workload install wasm-tools
      - run: dotnet restore DotnetDide.slnx --locked-mode
      - run: dotnet test tests/DotnetDide.Core.Tests --no-restore
      - run: dotnet publish src/DotnetDide.Browser -c Release -o artifacts/site --no-restore
      - run: dotnet test tests/DotnetDide.Browser.Tests --no-restore
        env:
          CHROME_BIN: /usr/bin/google-chrome
      - uses: actions/upload-artifact@v4
        with:
          name: dotnetdide-browser
          path: artifacts/site/wwwroot
      - uses: actions/upload-pages-artifact@v4
        if: github.ref == 'refs/heads/master' && github.event_name != 'pull_request'
        with:
          path: artifacts/site/wwwroot
      - uses: actions/upload-artifact@v4
        with:
          name: playground-screenshots
          path: artifacts/playground-*.png
  deploy:
    if: github.ref == 'refs/heads/master' && github.event_name != 'pull_request'
    needs: test
    runs-on: ubuntu-24.04
    permissions:
      pages: write
      id-token: write
    concurrency:
      group: github-pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/configure-pages@v5
      - name: Deploy testing page
        id: deployment
        uses: actions/deploy-pages@v4
