<!doctype html>
<meta charset="utf-8">
<meta name="referrer" content="no-referrer">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'unsafe-inline'; style-src 'unsafe-inline'; img-src data:; media-src data:; font-src data:; connect-src 'none'; frame-src 'none'; form-action 'none'; base-uri 'none'; object-src 'none'">
<title>Interactive site preview</title>
<script>
// A separate document lets generated scripts run without relaxing the host app's CSP.
// The caller MUST keep this document in sandbox="allow-scripts allow-forms" (opaque origin).
if (parent !== window) {
  const token = location.hash.slice(1);
  const receive = event => {
    if (event.source !== parent || event.data?.type !== 'dotnetdide-wire-document' || event.data.token !== token || typeof event.data.html !== 'string') return;
    removeEventListener('message', receive);
    document.open(); document.write(event.data.html); document.close();
  };
  addEventListener('message', receive);
  parent.postMessage({type:'dotnetdide-wire-host-ready', token}, '*');
}
</script>
